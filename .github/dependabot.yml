version: 2

# B0-09 (hop-dong.md §2, prompt [2]): ba hệ — uv (gốc), github-actions (gốc),
# docker (deploy/docker). `commit-message.prefix` + `include: scope` sinh dòng
# đầu "<prefix>(deps): Bump …" — qua được `.githooks/commit-msg` (BE-00 §13.2).
# PR của Dependabot đổi `uv.lock` đi qua CI và người điều phối duyệt như PR
# thường (BE-00 §13.1) — nhánh `dependabot/**` được miễn luật tên nhánh (job
# `commits`, hop-dong.md §2).
# L8-N02: tên nhóm ngắn (`uv`/`actions`/`docker`) để tiêu đề PR nhóm "<prefix>(deps): Bump the <nhóm> group across 1
# directory with N updates" ≤ 72 ký tự (job `commits` kiểm tiêu đề PR bằng hook, không miễn cho dependabot).
# NO-153: `ignore` chặn Dependabot tự gộp bản **major** — bản `redis` 6→8 (`d0bb175`, PR #5) gộp
# thẳng vào `main` không qua cổng gây NO-148 (mypy đỏ 6 lỗi). Ràng buộc phiên bản của gói riêng
# (vd `packages/messaging/pyproject.toml` cho `redis`) là lớp phòng thủ thứ hai, không thay cho lớp
# này — `ignore` áp dụng cho mọi gói của hệ, kể cả gói chưa kịp ràng buộc version.
# `open-pull-requests-limit: 2`: mỗi PR Dependabot chạy cả cổng CI (~10 job); hàng đợi Actions của tài
# khoản bị PR cũ chiếm chỗ (02/11/2026). Mỗi hệ đã gộp nhóm nên 2 là đủ (nhóm + một bản major/bảo mật).
updates:
  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      uv:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # NO-414: torch/torchvision/ultralytics khoá cùng SHA ONNX YOLO ghim và bánh CUDA của
      # ml.Dockerfile — nâng chúng là việc ML có chủ (xuất lại + revision B6-01), không phải bump.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "ultralytics"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # NO-178/NO-183: hệ `docker` không có kênh security-update, nên KHÔNG `ignore` major trần —
    # bản major ảnh nền vẫn được đề xuất (PR riêng, không vào nhóm minor/patch; CI là required check).
    # Đổi minor của ảnh nền `python`/`node` (3.12→3.14, bỏ corepack) là việc có chủ đích kèm relock.
    # Cú pháp: docs.github.com → Dependabot options reference → `ignore` / `update-types`.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "build"
      include: "scope"
