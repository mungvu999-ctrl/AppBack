name: Notify

# B0-10 [6]: một tin cảnh báo khi CI hỏng trên main, khi Deploy xong hoặc hỏng, khi
# Restore drill hỏng. FIX-136: Commits (tách khỏi CI) và CodeQL hỏng trên main cũng báo như CI —
# mọi workflow chạy trên `push: main` phải nằm trong danh sách dưới. Không checkout, không chạy mã
# của lượt được báo (lượt từ PR fork vẫn kích hoạt workflow_run, có secret) — mọi giá trị sự kiện
# đi qua env:.
# L5-N03: webhook rỗng hoặc POST hỏng thì KHÔNG im — mở/bình luận một issue nhãn `alert` (gom theo tên
# workflow) bằng GITHUB_TOKEN; `workflow_dispatch` (input `message`) để gửi tin thử:
#   gh workflow run notify.yml -f message="thử cảnh báo"
on:
  workflow_run:
    workflows: [CI, Commits, CodeQL, Deploy, "Restore drill"]
    types: [completed]
  workflow_dispatch:
    inputs:
      message:
        description: Nội dung tin thử gửi tới kênh cảnh báo
        required: false
        default: tin thử từ workflow Notify
        type: string

permissions: {}

jobs:
  notify:
    # Lọc thô ở mức job để lượt ngoài `main` (PR, Dependabot) không chiếm runner chỉ để in "không gửi";
    # bước đầu vẫn lọc đúng bảng. Không gồm cả kết luận: Deploy gửi cả khi thành công.
    if: >-
      github.event.workflow_run.head_branch == 'main'
      || github.event.workflow_run.name == 'Deploy'
      || github.event.workflow_run.name == 'Restore drill'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Chỉ để mở/bình luận issue `alert` khi kênh webhook hỏng (L5-N03); workflow-level vẫn `{}`.
    permissions:
      issues: write
    # Secret ALERT_WEBHOOK_URL nằm ở Environment `alerts` (không protection rule), không ở cấp repository (SEC-061).
    environment: alerts
    env:
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_MESSAGE: ${{ github.event.inputs.message }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HTML_URL: ${{ github.event.workflow_run.html_url }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: quyet dinh co gui tin hay khong
        run: |
          send=0
          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then
            echo "SEND_ALERT=1" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$WORKFLOW_NAME" in
            CI | Commits | CodeQL)
              [ "$CONCLUSION" = "failure" ] && [ "$HEAD_BRANCH" = "main" ] && send=1
              ;;
            Deploy)
              if [ "$CONCLUSION" = "success" ] || [ "$CONCLUSION" = "failure" ]; then
                send=1
              fi
              ;;
            "Restore drill")
              [ "$CONCLUSION" = "failure" ] && send=1
              ;;
          esac
          if [ "$send" -ne 1 ]; then
            echo "không gửi — $WORKFLOW_NAME kết thúc $CONCLUSION, nhánh $HEAD_BRANCH không thuộc điều kiện gửi"
            exit 0
          fi
          echo "SEND_ALERT=1" >> "$GITHUB_ENV"
      - name: gui tin canh bao
        if: env.SEND_ALERT == '1'
        run: |
          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then
            message="${DISPATCH_MESSAGE:-tin thử từ workflow Notify}"
          else
            sha12="${HEAD_SHA:0:12}"
            message="Workflow ${WORKFLOW_NAME} kết thúc ${CONCLUSION} trên ${HEAD_BRANCH} (${sha12}): ${HTML_URL}"
          fi
          # Tin lưu ra tệp để bước dự phòng (issue) dùng lại đúng nội dung, không qua $GITHUB_ENV (tin thử có thể nhiều dòng).
          printf '%s' "$message" > "${RUNNER_TEMP:-/tmp}/alert-message.txt"
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "::warning::chưa cấu hình ALERT_WEBHOOK_URL — chuyển sang issue nhãn alert"
            echo "ALERT_FALLBACK=1" >> "$GITHUB_ENV"
            exit 0
          fi
          payload="$(MESSAGE="$message" python3 -c 'import json, os; m = os.environ["MESSAGE"]; print(json.dumps({"text": m, "content": m}))')"
          if ! printf '%s' "$payload" | curl --fail --max-time 10 -H 'Content-Type: application/json' --data @- "$ALERT_WEBHOOK_URL"; then
            echo "::warning::gửi thông báo thất bại — chuyển sang issue nhãn alert"
            echo "ALERT_FALLBACK=1" >> "$GITHUB_ENV"
            exit 0
          fi
      - name: issue canh bao du phong
        if: env.SEND_ALERT == '1' && env.ALERT_FALLBACK == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Gom theo tên workflow: đã có issue `alert` mở cùng tiêu đề thì bình luận, không tạo mới (CI đỏ liên tục không spam).
          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then key="Notify (tin thử)"; else key="$WORKFLOW_NAME"; fi
          title="Cảnh báo: ${key}"
          body_file="${RUNNER_TEMP:-/tmp}/alert-message.txt"
          gh label create alert --color D93F0B --description "Cảnh báo vận hành tự động" >/dev/null 2>&1 || true
          existing="$(gh issue list --label alert --state open --search "\"$title\" in:title" --json number,title             --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --label alert --title "$title" --body-file "$body_file"
          fi
