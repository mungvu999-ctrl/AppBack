# Danh sách location dùng chung giữa server app của dev (8080) và prod (8443),
# để không lặp (RULE-CODE R-07). Include bằng đường tuyệt đối từ template.
client_max_body_size 8m;
set $api http://api:8000;

# Nén tài sản tĩnh: JS/CSS gửi thô nặng gấp ~3,6 lần gzip (đo 2026-10-24: three 625 → 152 KiB).
# Cố ý KHÔNG có application/json: JSON của /api mang token/CSRF cạnh dữ liệu người dùng
# gửi lên, nén nó mở đường BREACH. text/html luôn được nén khi `gzip on` (chỉ index.html).
# Ngoại lệ duy nhất: location regex của route đọc không gian bên dưới (PERF-03 P14).
# ponytail: nén lúc phục vụ; muốn bớt CPU thì dựng sẵn .gz + `gzip_static on`.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript image/svg+xml application/wasm text/plain;

error_page 413 /__errors/413;
error_page 502 503 504 =503 /__errors/503;

location /api/ {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_pass $api;
}

# PERF-03 P14: ba route đọc tài liệu không gian (N15 đồ thị, N16 lớp, N18 ảnh chụp — tới
# ~142 KB JSON) được nén riêng. An toàn với BREACH vì: (1) thân không mang token/CSRF/session —
# xác thực đi bằng header `Authorization` do JS cùng origin gắn, không có cookie ambient, nên
# trang lạ không thể khiến trình duyệt nạn nhân gửi lượt đọc **đã xác thực** để đo kích thước;
# (2) URL ký của bản vẽ trong `level.drawings` chỉ mở chính bản vẽ của dự án, mà người duy nhất
# chèn được chữ vào tài liệu (thành viên có quyền sửa) vốn đã đọc được bản vẽ đó. Không mở
# rộng cho /api/projects (danh sách nhiều dự án, URL ký) hay route auth (trả token).
location ~ ^/api/projects/[^/]+/(spatial|floors/[^/]+/spatial/layer|versions/[^/]+/snapshot)$ {
    gzip on;
    gzip_types application/json;
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_pass $api;
}

location /api/streams/ {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 1h;
    # Trần luồng SSE mở cùng lúc mỗi IP (BE-00 §11, NO-335 B): app cho ≤ 6 luồng mỗi người
    # dùng và ≤ 500 toàn cục; 30 = 6 luồng × ~5 người sau một NAT (văn phòng, nhà) — chặn một
    # IP mở hàng trăm kết nối giữ worker/pool Redis trước khi tới app. nginx thấy IP client
    # thật (không có proxy phía trước, không `set_real_ip_from`); thêm CDN thì phải đổi khoá.
    limit_conn appback_streams_ip 30;
    limit_conn_status 429;
    limit_conn_log_level warn;
    error_page 429 /__errors/429;
    proxy_pass $api;
}

# Token /api/files/{token} là quyền đọc file, không vào log (BE-00 §8).
# Quyết định chính ở MỨC LOCATION, trên $uri đã chuẩn hoá, chứ không đoán dạng thô của
# $request_uri bằng regex như bản cũ (map ở access_log_files_map.conf chỉ là lớp thứ hai
# cho lỗi tiền-location, NO-197): nginx chuẩn hoá path trước khi
# chọn location, nên `/api/./files/…`, `/api/x/../files/…`, `/%61pi/files/…`,
# `/api%2Ffiles/…` đều tới ĐÂY mà regex cũ bỏ lọt (NO-095 — vá triệu chứng, R-19).
# `access_log off` một mình không đủ: khi api không tới được, error_page chuyển
# hướng nội bộ và nginx ghi log theo location ĐÍCH (đã kiểm bằng chạy thực), nên
# location này trỏ error_page sang hai đích riêng cũng tắt log.
# access_log chỉ chữa log truy cập: mỗi lần api không tới được (DNS lỗi, connect()
# failed — mọi lúc api khởi động lại), nginx còn ghi nguyên dòng
# "request: GET /api/files/<token> …" vào error log (BE-00 §8, review 2026-09-22
# #2, probe Q2); nâng mức error_log của chính location này lên crit để bỏ dòng đó
# (đường error log thật của ảnh nền là /var/log/nginx/error.log, đo bằng docker
# logs — nginxinc symlink ra stderr).
location /api/files/ {
    access_log off;
    error_log /var/log/nginx/error.log crit;
    error_page 413 /__errors/413-files;
    error_page 502 503 504 =503 /__errors/503-files;
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_pass $api;
}

# K-41: token liên kết chia sẻ `/api/share/{token}` (API) và `/share/{token}` (trang SPA) là
# quyền đọc mặt bằng + địa chỉ công trình — cùng chính sách "token không vào log" như
# /api/files/ (BE-00 §8, threat-model "Liên kết chia sẻ"). `^~` để regex location nào sau này
# thêm không cướp đường này. Dùng lại đích lỗi `-files` (đã `access_log off`) để error_page
# chuyển hướng nội bộ không ghi log theo location đích.
location ^~ /api/share/ {
    access_log off;
    error_log /var/log/nginx/error.log crit;
    error_page 413 /__errors/413-files;
    error_page 502 503 504 =503 /__errors/503-files;
    include /etc/nginx/appback/snippets/proxy_common.conf;
    proxy_pass $api;
}

# Trang SPA của liên kết: `rewrite … break` giữ nguyên location này (có `access_log off`) khi
# phục vụ /index.html; `try_files` sẽ chuyển nội bộ sang `location /` và vẫn ghi log.
# Header bảo mật và Cache-Control y hệt `location = /index.html`.
location ^~ /share/ {
    access_log off;
    error_log /var/log/nginx/error.log crit;
    include /etc/nginx/appback/snippets/security_headers.conf;
    add_header Cache-Control "no-cache" always;
    rewrite ^ /index.html break;
}

location = /api/admin/ml/model-versions {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_pass $api;
}

# N42 (LB-01): thân là GLB thô của editor, API giới hạn 128 MiB (`body_limit`).
location ~ ^/api/projects/[^/]+/lighting-bakes$ {
    include /etc/nginx/appback/snippets/proxy_common.conf;
    client_max_body_size 128m;
    proxy_request_buffering off;
    proxy_pass $api;
}

location / {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri /index.html;
}

location /assets/ {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# B-V10-41: mount của viewer Pascal không băm tên — không được dính immutable của /assets/.
location = /assets/pascal/pascal-mount.js {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location /draco/ {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri =404;
}

# F-15 (B05-G-145/146): bộ giải KTX2 của Pascal (`ktx2-loader.ts` `setTranscoderPath('/basis/')`)
# và vật liệu `.ktx2` (`NEXT_PUBLIC_ASSETS_CDN_URL="/pascal"`) — thiếu tệp phải 404, không rơi
# xuống `location /` trả index.html 200. Tên không băm: cache có hạn, không immutable.
location /basis/ {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri =404;
}

location /pascal/ {
    include /etc/nginx/appback/snippets/security_headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
}

location = /index.html {
    include /etc/nginx/appback/snippets/security_headers.conf;
    add_header Cache-Control "no-cache" always;
}

# W7: thân lỗi của chính nginx (không proxy_intercept_errors — 503
# IDEMPOTENCY_IN_PROGRESS của app phải tới FE nguyên vẹn).
location = /__errors/413 {
    include /etc/nginx/appback/snippets/error_413_body.conf;
}

location = /__errors/503 {
    include /etc/nginx/appback/snippets/error_503_body.conf;
}

# 429 của `limit_conn` ở /api/streams/: JSON W7 như app, `Retry-After` kẹp ≤ 10 s (W9).
location = /__errors/429 {
    internal;
    default_type application/json;
    add_header Retry-After 10 always;
    include /etc/nginx/appback/snippets/error_body_headers.conf;
    return 429 '{"code":"RATE_LIMITED","requestId":"$appback_request_id"}';
}

# Bản sinh đôi cho /api/files/: thân y hệt, chỉ thêm access_log off (NO-095).
location = /__errors/413-files {
    access_log off;
    include /etc/nginx/appback/snippets/error_413_body.conf;
}

location = /__errors/503-files {
    access_log off;
    include /etc/nginx/appback/snippets/error_503_body.conf;
}
